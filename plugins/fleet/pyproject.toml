[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet"
version = "0.1.0"
description = "Keep the per-user Claude Code setup the same on every machine you work from."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fleet = "fleet.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/fleet/tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/fleet/tests/**" = ["S101"]
